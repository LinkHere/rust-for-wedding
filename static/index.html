<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Data</title>
    <script>
        let lastData = null; // Store the last data to compare changes
        let errorCount = 0; // Track consecutive errors

        async function fetchSheetsData() {
            try {
                const response = await fetch("http://127.0.0.1:3000/sheets");
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                
                if (JSON.stringify(data) !== JSON.stringify(lastData)) {
                    lastData = data; // Update stored data
                    displayData(data);
                }
                
                errorCount = 0; // Reset error count on success
            } catch (error) {
                console.error("Error fetching data:", error);
                errorCount++;
                
                if (errorCount >= 3) {
                    document.getElementById("error").innerText = "⚠️ Connection issue, updates may be delayed.";
                }
            }
        }

        function displayData(data) {
            const output = document.getElementById("output");
            output.innerHTML = "";

            if (data.values) {
                const table = document.createElement("table");
                table.border = "1";

                data.values.forEach(row => {
                    const tr = document.createElement("tr");
                    row.forEach(cell => {
                        const td = document.createElement("td");
                        td.textContent = cell;
                        tr.appendChild(td);
                    });
                    table.appendChild(tr);
                });

                output.appendChild(table);
            } else {
                output.innerText = "No data found.";
            }
        }

        // Fetch data only if changes are detected, every 5 seconds
        setInterval(fetchSheetsData, 5000);

        // Fetch data once when the page loads
        window.onload = fetchSheetsData;
    </script>
</head>
<body>
    <h1>Google Sheets Data</h1>
    <button onclick="fetchSheetsData()">Refresh Data</button>
    <div id="error" style="color: red; margin-bottom: 10px;"></div>
    <div id="output"></div>
</body>
</html>
